<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>提交成功 - 禹吉</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: #0a0a0f;
    color: #e8e0d0;
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; min-height: 100dvh;
    text-align: center;
    padding: 20px;
  }
  .card {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(200,160,80,0.2);
    border-radius: 20px;
    padding: 50px 40px;
    max-width: 460px;
    width: 100%;
  }
  .icon { font-size: 3rem; margin-bottom: 20px; }
  h1 { font-size: 1.6rem; color: #d4b87a; margin-bottom: 12px; letter-spacing: 0.05em; }
  p { color: #a09080; line-height: 1.8; margin-bottom: 30px; font-size: 0.95rem; }
  a {
    display: inline-block;
    padding: 12px 30px;
    background: linear-gradient(135deg, #c8963e 0%, #8b5e2f 100%);
    color: #fff; text-decoration: none;
    border-radius: 10px;
    font-weight: 600; letter-spacing: 0.06em;
    transition: transform 0.2s, box-shadow 0.3s;
  }
  a:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(200,150,60,0.35); }
</style>
</head>
<body>
<div class="card">
  <div class="icon">✓</div>
  <h1>反馈提交成功</h1>
  <p>感谢你的宝贵意见！我们会认真对待每一条反馈，持续改进网站。</p>
  <a href="index.html">返回首页</a>
</div>
</body>
</html>
